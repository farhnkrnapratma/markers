[package]
name = "markers"
description = "High-performance HTML to Markdown conversion for LLMs"
version = "0.1.0-alpha"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/farhnkrnapratma/markers"
authors = ["farhnkrnapratma"]
readme = "README.md"
keywords = ["html", "markdown", "converter", "llm", "parser"]
categories = ["parsing", "text-processing", "web-programming"]
exclude = [
    "/CLAUDE.md",
    "/.claude",
    "/.github",
    "/.githooks",
    "/commitlint.config.js",
    "/artifacts",
    "/bun.lock",
    "/examples/*.js",
    "/examples/*.html",
    "/graphify-out",
    "/index.d.ts",
    "/index.js",
    "/node_modules",
    "/npm",
    "/package.json",
    "/tests/index.test.js",
]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
napi = ["dep:napi", "dep:napi-derive", "dep:napi-build"]
wasm = ["dep:wasm-bindgen", "dep:serde", "dep:serde-wasm-bindgen"]

[dependencies]
scraper = "0.29"
ego-tree = "0.11"
rustc-hash = "2.1"
regex = "1.13"
once_cell = "1.21"
wasm-bindgen = { version = "0.2", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
napi = { version = "3", optional = true }
napi-derive = { version = "3", optional = true }

[build-dependencies]
napi-build = { version = "2", optional = true }

[dev-dependencies]
pretty_assertions = "1.4"
